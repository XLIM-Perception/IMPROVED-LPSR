[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "improved-lpsr"
dynamic = ["version"]
description = "Multi-frame license plate super-resolution, with an array-only Python API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.3.5",
]

[project.optional-dependencies]
demo = ["pillow==12.1.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "lpsr._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["lpsr", "lpsr.*"]
exclude = ["legacy", "legacy.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pth", "*.pt", "*.png", "*.jpg", "*.jpeg"]
